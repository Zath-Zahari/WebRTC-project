<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Conference</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- === Entry Section (Added Name Input) === -->
    <div id="entry-section">
        <h1>WebRTC Video Conference</h1>
        <div id="join-controls">
            <input type="text" id="nameInput" placeholder="Enter Your Name">
            <input type="text" id="roomInput" placeholder="Enter Room Name">
            <button id="joinBtn">Join Room</button>
        </div>
         <p>Enter your name and the same room name as others to connect.</p>
    </div>
    <!-- === End Entry Section === -->

    <div id="call-section" class="hidden">
         <!-- Video Grid -->
        <div id="videos-grid">
             <!-- Local video wrapper -->
            <div class="video-wrapper" id="local-video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-info">
                    <!-- === Participant name span (will be updated by JS) === -->
                    <span class="participant-name" id="localParticipantName">You</span>
                    <span class="status-icons">
                        <i id="local-mic-icon" class="fas fa-microphone icon-mic-on"></i>
                        <i id="local-cam-icon" class="fas fa-video icon-cam-on"></i>
                    </span>
                </div>
            </div>
             <!-- Remote videos will be added here -->
        </div>

        <!-- Controls Bar -->
        <div id="controls-bar">
            <button id="muteBtn" class="control-button mute-button" title="Mute/Unmute">
                <i class="fas fa-microphone"></i>
                <span>Mute</span>
            </button>
            <button id="cameraBtn" class="control-button camera-button" title="Turn Camera On/Off">
                 <i class="fas fa-video"></i>
                 <span>Cam Off</span>
            </button>
            <button id="leaveBtn" class="control-button leave-button" title="Leave Meeting">
                <i class="fas fa-phone-slash"></i>
                <span>Leave</span>
            </button>
            <button id="toggleChatBtn" class="control-button chat-toggle-button" title="Toggle Chat">
                <i class="fas fa-comments"></i>
                <span>Chat</span>
            </button>
             <span id="currentRoomDisplay" class="room-display"></span> <!-- Display current room name -->
        </div>

        <!-- Chat Sidebar -->
        <div id="chat-sidebar" class="hidden">
             <h3>Chat</h3>
             <button id="closeChatBtn" class="close-chat-button">×</button>
            <div id="chatbox">
                <!-- Messages will appear here -->
            </div>
            <div id="chat-input">
                <input type="text" id="messageInput" placeholder="Type message..." disabled>
                <button id="sendBtn" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
